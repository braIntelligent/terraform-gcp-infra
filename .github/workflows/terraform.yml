name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform.yml'

env:
  TF_VERSION: '1.7.0'
  WORKING_DIR: './environments/dev'

jobs:
  # ─────────────────────────────────────────
  # VALIDATE — formato, sintaxis y análisis estático
  #
  # No toca GCP: `terraform fmt`, `validate` y tfsec analizan el código, no la
  # infraestructura. Por eso este job corre siempre, incluso en PRs de forks,
  # donde GitHub no expone los secrets del repositorio.
  #
  # El `init` usa -backend=false porque el backend remoto es un bucket GCS:
  # sin ese flag, Terraform intentaría autenticarse solo para descargar
  # providers y validar sintaxis.
  # ─────────────────────────────────────────
  validate:
    name: Validate — Format, Syntax & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      # El job de plan lee esta salida para saber si puede autenticarse.
      has_gcp: ${{ steps.check_secrets.outputs.has_gcp }}

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # El contexto `secrets` no está disponible en el `if` de un job,
      # así que se evalúa acá y se expone como output.
      - name: Check GCP credentials
        id: check_secrets
        working-directory: .
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ] && [ -n "$GCP_PROJECT_ID" ]; then
            echo "has_gcp=true" >> "$GITHUB_OUTPUT"
            echo "Credenciales GCP presentes: se ejecuta plan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_gcp=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Plan omitido"
              echo "Faltan los secrets \`WIF_PROVIDER\`, \`WIF_SERVICE_ACCOUNT\` o \`GCP_PROJECT_ID\`."
              echo "La validación de formato, sintaxis y seguridad sí se ejecutó."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      # -backend=false: descarga providers y módulos sin conectarse al bucket
      # de estado remoto. Suficiente para validar, imposible de aplicar.
      - name: Terraform Init (sin backend)
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.WORKING_DIR }}
          soft_fail: true         # reporta hallazgos sin bloquear el pipeline

  # ─────────────────────────────────────────
  # PLAN — calcula el diff contra la infraestructura real
  #
  # Necesita autenticarse contra GCP, así que solo corre cuando los secrets
  # están configurados. Usa Workload Identity Federation: GitHub intercambia
  # su token OIDC por credenciales de corta duración, sin llaves estáticas
  # de service account guardadas en el repositorio.
  # ─────────────────────────────────────────
  plan:
    name: Plan — Diff contra infraestructura real
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has_gcp == 'true'

    permissions:
      contents: read
      pull-requests: write        # para comentar el plan en el PR
      id-token: write             # para Workload Identity Federation

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan \
            -no-color \
            2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          WORKING_DIR: ${{ env.WORKING_DIR }}
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.WORKING_DIR;
            const plan = fs.readFileSync(`${dir}/plan_output.txt`, 'utf8');
            const maxLength = 65000;
            const truncated = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n\n... output truncated'
              : plan;
            const planStatus = '${{ steps.plan.outcome }}' === 'success' ? 'OK' : 'FALLO';
            const body = `## Terraform Plan — \`${dir}\`

            **Estado:** ${planStatus}

            <details><summary>Ver salida del plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *Lanzado por @${{ github.actor }} — commit \`${{ github.sha }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────
  # APPLY — solo en push a main, detrás de aprobación manual
  #
  # `environment: production` hace que GitHub detenga el job y espere
  # aprobación humana antes de modificar infraestructura real.
  # ─────────────────────────────────────────
  apply:
    name: Apply — Despliegue a producción
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform init

      # Se recalcula el plan en vez de reutilizar el artefacto del job anterior:
      # entre el plan y la aprobación manual pueden pasar horas y la
      # infraestructura real puede haber cambiado.
      - name: Terraform Plan (pre-apply)
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Show Outputs
        run: terraform output
