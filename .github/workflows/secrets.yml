name: Secrets scan

# Workflow aparte porque terraform.yml filtra por rutas: un secreto puede
# entrar en cualquier archivo, no solo en un .tf.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets — gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0         # gitleaks revisa todo el historial, no solo el último commit

      - name: Scan history with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner --verbose
